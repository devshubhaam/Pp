<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>File</title>
__META__
<style>
  :root {
    --bg: #f3f0ea;
    --ink: #23211e;
    --muted: #7a746a;
    --line: #ddd7cc;
    --accent: #3f6b5e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #191a1a;
      --ink: #e9e6df;
      --muted: #9a958b;
      --line: #33322e;
      --accent: #86b0a2;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 0px) 24px env(safe-area-inset-bottom, 0px);
  }
  main { width: 100%; max-width: 300px; text-align: center; }

  .mark { width: 44px; height: 44px; margin: 0 auto 22px; color: var(--accent); }
  .mark svg { width: 100%; height: 100%; display: block; }

  h1 { margin: 0 0 8px; font-size: 20px; line-height: 1.3; font-weight: 600; letter-spacing: -0.01em; }
  #step { margin: 0; min-height: 21px; font-size: 14px; line-height: 1.5; color: var(--muted); transition: opacity .25s ease; }
  #step.swap { opacity: 0; }

  .bar { height: 3px; margin: 26px auto 0; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 2px; transition: width .7s cubic-bezier(.3, .6, .3, 1); }

  .hint { margin: 28px 0 0; font-size: 13px; line-height: 1.6; color: var(--muted); opacity: 0; visibility: hidden; transition: opacity .4s ease; }
  .hint.show { opacity: 1; visibility: visible; }
  .hint a { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line); }

  body.err .bar, body.err .hint { display: none; }
  body.err .mark { color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .bar i, #step, .hint { transition: none; }
  }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">
    <svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 5.5h14.5L34 13v23.5a2 2 0 0 1-2 2H12a2 2 0 0 1-2-2V7.5a2 2 0 0 1 2-2z"/>
      <path d="M26 5.5V13h8"/>
      <path d="M17 24h10M17 29h6"/>
    </svg>
  </div>

  <h1 id="title">Opening your file</h1>
  <p id="step">Checking your link</p>

  <div class="bar" id="bar"><i id="fill"></i></div>

  <p class="hint" id="hint">Telegram didn't open?<br><a id="manual" href="__TARGET_ATTR__">Tap here</a></p>
</main>

<script>
const TARGET = __TARGET_JSON__;
const MSG = __MSG_JSON__;
const $ = (id) => document.getElementById(id);

if (!TARGET) {
  document.body.classList.add("err");
  $("title").textContent = "Couldn't open the link";
  $("step").textContent = MSG || "Please try again in a moment.";
} else {
  const steps = ["Checking your link", "Connecting to the bot", "Opening Telegram"];
  const fill = $("fill");
  const step = $("step");

  function setStep(i) {
    step.classList.add("swap");
    setTimeout(() => { step.textContent = steps[i]; step.classList.remove("swap"); }, 220);
  }

  requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = "35%"; }));
  setTimeout(() => { setStep(1); fill.style.width = "70%"; }, 700);
  setTimeout(() => { setStep(2); fill.style.width = "100%"; }, 1400);
  setTimeout(() => { location.replace(TARGET); }, 1900);
  setTimeout(() => { $("hint").classList.add("show"); }, 4500);
}
</script>
</body>
</html>
