<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>File</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!--MONETAG_TAG-->
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #f3f0ea);
    --ink: var(--tg-theme-text-color, #23211e);
    --muted: var(--tg-theme-hint-color, #7a746a);
    --line: rgba(128, 122, 112, .28);
    --accent: #3f6b5e;
    --accent-ink: #ffffff;
    --err: #a8483f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --accent: #86b0a2; --accent-ink: #14201c; --err: #d08a82; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 0px) 24px env(safe-area-inset-bottom, 0px);
  }
  main { width: 100%; max-width: 300px; text-align: center; }

  .icon { width: 34px; height: 34px; margin: 0 auto 18px; position: relative; }
  .spinner {
    width: 100%; height: 100%; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent);
    animation: spin 1s linear infinite;
  }
  .tick { display: none; width: 100%; height: 100%; color: var(--accent); }
  .icon.done .spinner, .icon.stop .spinner { display: none; }
  .icon.done .tick { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #status { margin: 0; min-height: 22px; font-size: 15px; line-height: 1.5; }
  #status.err { color: var(--err); }
  #progress { margin: 6px 0 0; min-height: 18px; font-size: 13px; color: var(--muted); }

  .btn {
    display: inline-block; margin-top: 20px; padding: 11px 22px;
    border-radius: 10px; font: inherit; font-size: 15px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: var(--ink);
  }
  .btn.solid { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
</style>
</head>
<body>
<main>
  <div class="icon" id="icon">
    <div class="spinner"></div>
    <svg class="tick" viewBox="0 0 34 34" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="17" cy="17" r="15"/>
      <path d="M10.5 17.5l4.5 4.5 8.5-9.5"/>
    </svg>
  </div>
  <p id="status">Taiyaar ho raha hai…</p>
  <p id="progress"></p>
  <button class="btn" id="retry" hidden>Dobara try karo</button>
  <button class="btn solid" id="openbot" hidden>Bot kholo</button>
</main>

<script>
const CFG = __CFG__;
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();
try { tg.setHeaderColor("bg_color"); tg.setBackgroundColor("bg_color"); } catch (e) {}

const qs = new URLSearchParams(location.search);
let sid = qs.get("sid") || null;                     // purana bot-button flow
const startParam = (tg.initDataUnsafe && tg.initDataUnsafe.start_param) || "";
const $ = (id) => document.getElementById(id);
let rewarded = false;
let askedWrite = false;

function setStatus(text, cls) {
  const el = $("status");
  el.textContent = text;
  el.className = cls || "";
}
function setProgress(done, required) {
  $("progress").textContent = required > 1 ? Math.min(done + 1, required) + " / " + required : "";
}
function setIcon(state) {                              // "" | "stop" | "done"
  $("icon").className = "icon " + state;
}
function fail(msg) {
  setStatus(msg, "err");
  setIcon("stop");
  $("retry").hidden = false;
}

async function api(path) {
  const r = await fetch(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sid: sid, init_data: tg.initData }),
  });
  return r.json();
}

// Monetag SDK ka global function (show_<zoneId>) aane tak wait
function waitForSdk(name, ms) {
  return new Promise((resolve, reject) => {
    const t0 = Date.now();
    (function check() {
      if (typeof window[name] === "function") return resolve(window[name]);
      if (Date.now() - t0 > ms) return reject(new Error("sdk missing"));
      setTimeout(check, 100);
    })();
  });
}

async function startAd() {
  let show;
  try { show = await waitForSdk(CFG.sdkFn, 6000); }
  catch (e) { fail("Ad load nahi hua. Adblock ya Private DNS band karke try karo."); return; }

  setStatus("Ad chal raha hai…");
  show({ ymid: sid })
    .then((res) => {
      // user beech me band kare to bhi promise resolve hota hai, isliye reward sirf 'valued' pe
      if (CFG.requireValued && !(res && res.reward_event_type === "valued")) {
        fail("File ke liye ad poora dekhna zaroori hai.");
        return;
      }
      if (!rewarded) { rewarded = true; claim(); }
    })
    .catch(() => fail("Ad nahi dikh paya. Thodi der baad try karo."));
}

async function claim() {
  setStatus("Verify ho raha hai…");
  let r;
  try { r = await api("/api/ad/done"); }
  catch (e) { rewarded = false; fail("Network error. Dobara try karo."); return; }

  if (r.wait) { setTimeout(claim, r.wait * 1000 + 300); return; }
  if (!r.ok) { rewarded = false; fail(r.error || "Verify fail hua."); return; }

  setProgress(r.ads_done, r.ads_required);
  if (r.delivered) {
    setIcon("done");
    setStatus("Bhej diya. Chat me dekho.");
    setTimeout(() => tg.close(), 1400);
  } else {
    rewarded = false;
    begin();
  }
}

// Bot ne abhi tak user ko message karne ki permission nahi li
function needWrite(bot) {
  if (!askedWrite && typeof tg.requestWriteAccess === "function") {
    askedWrite = true;
    setStatus("Permission ka wait…");
    tg.requestWriteAccess((ok) => { if (ok) begin(); else showBot(bot); });
  } else {
    showBot(bot);
  }
}
function showBot(bot) {
  setIcon("stop");
  setStatus("File bhejne ke liye bot ko start karna hoga.");
  const b = $("openbot");
  b.hidden = false;
  b.onclick = () => {
    tg.openTelegramLink("https://t.me/" + bot + "?start=" + encodeURIComponent(startParam));
    tg.close();
  };
}

async function begin() {
  $("retry").hidden = true;
  $("openbot").hidden = true;
  setIcon("");
  rewarded = false;
  if (!tg.initData) { fail("Ye page Telegram ke andar se kholo."); return; }
  setStatus("Taiyaar ho raha hai…");

  let s;
  try { s = await api("/api/ad/start"); }
  catch (e) { fail("Network error. Dobara try karo."); return; }
  if (s.code === "no_write") { needWrite(s.bot); return; }
  if (!s.ok) { fail(s.error || "Session expire ho gaya."); return; }

  sid = s.sid;
  setProgress(s.ads_done, s.ads_required);
  startAd();
}

$("retry").addEventListener("click", begin);
begin();   // koi button nahi: mini app khulte hi ad shuru
</script>
</body>
</html>
